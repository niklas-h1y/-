<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero-Width Vanisher</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 260px;
      background: #0d0b14;
      color: #e2def0;
      font-family: system-ui, sans-serif;
      padding: 16px;
      text-align: center;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      letter-spacing: -0.03em;
      color: #b5a8ff;
    }
    p {
      margin: 0 0 16px;
      font-size: 13px;
      color: #837d99;
      line-height: 1.4;
    }
    button {
      width: 100%;
      min-height: 48px;
      border: 1px solid #b5a8ff;
      border-radius: 8px;
      background: #b5a8ff;
      color: #0d0b14;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    button:active {
      transform: scale(0.97);
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #a39bb8;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h1>Ghost Town 👻</h1>
  <p>Make all text on the active page completely invisible using U+200B characters.</p>
  
  <button id="vanish-btn" type="button">Vanish This Page</button>
  
  <div id="status" role="status">Ready to vanish.</div>

  <script src="popup.js"></script>
</body>
</html>
